name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hullops
          POSTGRES_PASSWORD: hullops
          POSTGRES_DB: hullops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://hullops:hullops@localhost:5432/hullops_test
      # Only signs tokens inside this throwaway CI run; not a real secret.
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else

    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" in the root package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma generate
      - run: pnpm --filter api exec prisma migrate deploy
      - run: pnpm -r lint
      # API: also checks tests, which Jest and nest build skip.
      # Web: also checks that the German translations are complete.
      - run: pnpm -r typecheck
      - run: pnpm -r test
      # Runs the API against the Postgres service above
      - run: pnpm --filter api test:e2e
      - run: pnpm -r build
